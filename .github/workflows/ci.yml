name: Проверка
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      LIDFOLD_TEST_RESULTS: ${{ github.workspace }}/LidfoldTests.xcresult
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Инструменты
        run: |
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Сборка и тесты без железа
        run: scripts/test.sh unit
      - name: Синтаксис скриптов
        run: |
          for script in scripts/*.sh; do zsh -n "$script"; done
      - name: Результаты тестов
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: ${{ env.LIDFOLD_TEST_RESULTS }}
          if-no-files-found: ignore
          retention-days: 7
