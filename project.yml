name: Kampsis
options:
  bundleIdPrefix: io.github.boundlessend
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # отдельная debug-библиотека ломает загрузку тестов через BUNDLE_LOADER
    ENABLE_DEBUG_DYLIB: NO
targets:
  Kampsis:
    type: application
    platform: macOS
    sources:
      - Kampsis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.boundlessend.kampsis
        INFOPLIST_FILE: Kampsis/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  KampsisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KampsisTests
    dependencies:
      - target: Kampsis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kampsis.app/Contents/MacOS/Kampsis"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Kampsis:
    build:
      targets:
        Kampsis: all
    test:
      targets:
        - KampsisTests
